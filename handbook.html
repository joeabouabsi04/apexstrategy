<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStrategy · The Handbook</title>
    <meta
      name="description"
      content="ApexStrategy Handbook — engineering reference for motorsport setup and race analysis."
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta property="og:title" content="ApexStrategy · The Handbook" />
    <meta
      property="og:description"
      content="Engineering reference for motorsport setup, tyre compounds, aerodynamics and track types."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <apex-nav></apex-nav>

    <!-- ═══════════════════════════════════════════════════════
       PAGE HERO
       ═══════════════════════════════════════════════════════ -->
    <header class="hb-hero" aria-labelledby="pageTitle">
      <div class="hb-hero-inner">
        <h1 id="pageTitle">THE HANDBOOK</h1>
        <p class="section-lede">
          Tyres, aerodynamics and the language of race engineering. Everything
          the workbench assumes you know, explained in four chapters.
        </p>
      </div>
    </header>

    <div class="hb-shell">
      <!-- ═════════════════════════════════════════════════════
         CHAPTER TABS + PANES
         CUSTOM UI REQUIREMENT: tabbed navigation implemented in
         JavaScript. The tab buttons and every pane's content are
         generated by js/HandbookController.js, which loops over the
         chapter data in js/handbook-data.js and then hands the DOM
         to the shared js/TabController.js (ES6 class with ARIA
         roles + arrow-key keyboard navigation). No chapter markup
         is hand-written here.
         ═════════════════════════════════════════════════════ -->
      <div
        class="workbench-nav"
        role="tablist"
        aria-label="Handbook chapters"
      ></div>

      <main class="workbench-panes hb-panes" id="hbPanes">
        <!-- Panes injected by HandbookController -->
      </main>
    </div>

    <!-- ═══════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════ -->
    <apex-footer></apex-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
